name: Security Pipeline
on: [push, pull_request]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Get target app (OWASP Juice Shop)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juice-shop/juice-shop
          path: target
      - name: Run Semgrep (security gate)
        run: semgrep scan --config auto --error target/

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Get target app (OWASP Juice Shop)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juice-shop/juice-shop
          path: target
      - name: Run Trivy filesystem scan (security gate)
        run: |
          docker run --rm -v "$PWD/target:/src" aquasec/trivy:latest fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /src
      - name: Run Trivy container image scan (security gate)
        if: always()
        run: |
          docker run --rm aquasec/trivy:latest image \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            bkimminich/juice-shop:latest
